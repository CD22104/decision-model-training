[project]
name = "trsi"
version = "1.0.0"
description = "Training RSI skill: choose the base model, training mode and hyperparameters of a OneJev decision model through onejev-harness (ojh)."
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trsi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
